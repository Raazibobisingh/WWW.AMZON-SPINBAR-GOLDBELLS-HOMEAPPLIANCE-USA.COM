<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#111;color:#fff;font-family:sans-serif;padding:12px}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #444;background:#000;color:#fff}button{padding:10px;background:#ffd700;color:#000;border:0;border-radius:8px;font-weight:900}</style><h3 style=color:#ffd700>Admin Login</h3><input id=pw type=password placeholder=raazi><button onclick="if(pw.value=='raazi'){a.style.display='block';l.style.display='none'}else alert('wrong')">Unlock</button><div id=l></div><div id=a style=display:none><h4>Platform Manager</h4><input id=pn placeholder=Platform><input id=pi placeholder=AffiliateID><button onclick="let x=JSON.parse(localStorage.plat||'[]');x.push({n:pn.value,i:pi.value});localStorage.plat=JSON.stringify(x);alert('Added:'+pn.value)">Add Platform</button><h4>Add Product</h4><input id=t placeholder=Title><input id=pr placeholder=Price><input id=im placeholder=Image><button onclick="let x=JSON.parse(localStorage.prod||'[]');x.push({t:t.value,p:pr.value,i:im.value});localStorage.prod=JSON.stringify(x);alert('Product Added')">Add Product</button><div id=out></div><button onclick="out.innerText=localStorage.prod">Show All</button></div>
